<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:Archivo,sans-serif;background:#f4f5f7;color:#111827;display:grid;grid-template-columns:240px 1fr}
nav{background:#fff;border-right:1px solid #e5e7eb;padding:22px 14px;font-size:14px}nav b{display:block;margin-bottom:24px;font-size:17px}
nav div{padding:9px 10px;border-radius:6px;color:#4b5563}nav .on{background:#eff6ff;color:#2563eb;font-weight:600}
main{padding:24px 28px}h1{font-size:22px;margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:20px}
.k{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px}.k p{font-size:12px;color:#6b7280}.k b{font-size:28px;display:block;margin:6px 0}.k span{font-size:11px;background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:99px}
.g{display:grid;grid-template-columns:1fr 1fr 340px;gap:16px}.c{background:#fff;border:1px solid #e5e7eb;border-radius:10px;height:300px;padding:16px;font-size:14px;font-weight:600}
</style></head><body>
<nav><b>AquaSense</b><div class="on">Overview</div><div>Parameters</div><div>Feeding</div><div>Water change</div><div>Aerator</div><div>Alerts</div><div>Settings</div></nav>
<main><h1>Overview</h1>
<div class="kpis"><div class="k"><p>Temperature</p><b>26.5 °C</b><span>Uncalibrated</span></div><div class="k"><p>pH</p><b>7.39</b><span>Uncalibrated</span></div><div class="k"><p>Turbidity</p><b>18.5 NTU</b><span>Uncalibrated</span></div><div class="k"><p>ORP</p><b>—</b></div><div class="k"><p>Tank level</p><b>—</b></div></div>
<div class="g"><div class="c">Temperature</div><div class="c">pH</div><div class="c">Risk model</div></div></main>
</body></html>
